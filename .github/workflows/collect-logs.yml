name: Collect diagnostics log

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'   # daily

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download summary + raw log from the site
        env:
          SITE: ${{ vars.SITE_URL || 'https://filefit.me/' }}
        run: |
          mkdir -p logs
          curl -fsS "${SITE%/}/diag/log.php?view=json&days=30" -o logs/summary-latest.json
          curl -fsS "${SITE%/}/diag/log.php?view=raw&days=31&n=20000" -o "logs/raw-$(date -u +%Y-%m).jsonl"
          echo "files logged (30 days): $(python3 -c "import json;print(json.load(open('logs/summary-latest.json'))['files'])")"

      - name: Commit
        run: |
          git config user.name "filefit-bot"
          git config user.email "filefit-bot@users.noreply.github.com"
          git add logs
          git diff --cached --quiet || git commit -m "Diagnostics log $(date -u +%F)"
          git pull --rebase --autostash && git push
